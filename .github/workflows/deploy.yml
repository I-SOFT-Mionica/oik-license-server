# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy
run-name: "Deploy to api.isoft.rs"

# Triggers on every push to main AND supports manual re-deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SERVER_URL: ${{ secrets.SERVER_BASE_URL }}
        run: |
          resp=$(curl -sf -X POST "$SERVER_URL/admin/deploy" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json")
          echo "Server response: $resp"

      - name: Health check (wait for restart)
        env:
          SERVER_URL: ${{ secrets.SERVER_BASE_URL }}
        run: |
          echo "Waiting 15s for container to restart..."
          sleep 15
          curl -sf "$SERVER_URL/healthz" && echo "OK" || { echo "HEALTH CHECK FAILED"; exit 1; }
